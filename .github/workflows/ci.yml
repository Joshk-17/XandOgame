name: CI

on:
  push:
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # Run the JUnit tests
      - name: Run unit tests
        run: gradle test --no-daemon

      # Build the application and database Docker images
      - name: Build containers
        run: docker compose build

      # Start the containers and wait until they are running
      - name: Start containers
        run: docker compose up -d --wait

      # Display the containers that are currently running
      - name: Show running containers
        run: docker compose ps

      # If something fails, show the Docker logs to help find the problem
      - name: Show logs if the workflow fails
        if: failure()
        run: docker compose logs --no-color

      # Stop and remove the containers when the workflow finishes
      - name: Stop containers
        if: always()
        run: docker compose down